<svg xmlns="http://www.w3.org/2000/svg" width="844" height="360" viewBox="0 0 844 360" role="img"
     aria-label="One AddressSanitizer report with the components of the signature boxed: the fault class on the SUMMARY line and three relevant function frames. Everything else in the report is greyed out. Below, the components joined by bars make the signature.">
<style>
  .bxt  {fill:#EEF2F6; stroke:#9DABB8; stroke-width:1;}
  .tm   {font-family:Tinos,"Times New Roman",Times,serif; fill:#2A3540;}
