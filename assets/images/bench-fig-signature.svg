  .tok  {font-family:Tinos,"Times New Roman",Times,serif; fill:#1F5C3E;}
  .ta   {font-family:Tinos,"Times New Roman",Times,serif; fill:#17408F;}
  .mono {font-family:Cousine,"Courier New",monospace; fill:#000000;}
  .monf {font-family:Cousine,"Courier New",monospace; fill:#3F4D5A;}
  .hia  {fill:#BBD0F0; stroke:#17408F; stroke-width:1.4;}
  .hik  {fill:#BFE3CE; stroke:#2E7A52; stroke-width:1.4;}
  .cap  {font-family:Arimo,Helvetica,sans-serif; fill:#46535F; font-size:10.5px;
         letter-spacing:.12em; text-transform:uppercase; font-weight:700;}
</style>
