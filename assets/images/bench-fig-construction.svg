        <text class="t"  x="274" y="252" font-size="12"   text-anchor="middle" font-weight="700">Build image</text>
        <text class="tm" x="264" y="268" font-size="10.5" text-anchor="middle">compile the harness under that</text>
        <text class="tm" x="264" y="281" font-size="10.5" text-anchor="middle">sanitizer into a challenge image</text>

        <path class="arr" d="M352 260 H380 M380 260 V92 M380 92 H388" marker-end="url(#ah)"/>

        <!-- ============ column 3 : rows 1-3 ============ -->
        <rect class="bx" x="392" y="60" width="160" height="64" rx="2"/>
        <text class="t"  x="472" y="84"  font-size="12"   text-anchor="middle" font-weight="700">Verify PoC</text>
        <text class="tm" x="472" y="100" font-size="10.5" text-anchor="middle">three runs in the built image,</text>
        <text class="tm" x="472" y="113" font-size="10.5" text-anchor="middle">the same signature each time</text>

        <text class="tf" x="599" y="82" font-size="9.5" text-anchor="middle">not reproducible</text>
        <path class="arrd" d="M552 92 H646" marker-end="url(#ahd)"/>
        <rect class="bxd" x="650" y="60" width="92" height="64" rx="2"/>
        <text class="tf" x="696" y="97" font-size="12" text-anchor="middle">Discarded</text>

        <text class="tf" x="487" y="138" font-size="9.5">reproduces</text>
        <path class="arr" d="M472 124 V142" marker-end="url(#ah)"/>

        <rect class="bxa" x="392" y="144" width="160" height="64" rx="2"/>
        <text class="ta" x="472" y="168" font-size="12"   text-anchor="middle" font-weight="700">Remove answer</text>
        <text class="ta" x="472" y="184" font-size="10.5" text-anchor="middle">strip everything that</text>
        <text class="ta" x="472" y="197" font-size="10.5" text-anchor="middle">names the defect</text>

        <path class="arr" d="M472 208 V226"  marker-end="url(#ah)"/>
        <path class="arr" d="M472 218 H745 M745 218 V226" marker-end="url(#ah)"/>

        <!-- GREEN -->
        <rect class="bxok" x="392" y="228" width="236" height="154" rx="2"/>
        <text class="tok" x="406" y="250" font-size="12" font-weight="700">The challenge image</text>
        <path class="hairok" d="M406 258 H614"/>

        <text class="mono" x="406" y="280" font-size="10">src/</text>
        <text class="tm"   x="476" y="280" font-size="9.5">source at the vulnerable commit</text>

        <text class="mono" x="406" y="306" font-size="10">harness/</text>
        <text class="tm"   x="476" y="306" font-size="9.5">harness source reaching the defect</text>

        <text class="mono" x="406" y="332" font-size="10">bench.yaml</text>
        <text class="tm"   x="476" y="332" font-size="9.5">alias, language, engine, sanitizer</text>

        <rect class="bxa"  x="400" y="344" width="220" height="22" rx="2"/>
        <rect class="rail" x="400" y="344" width="2.4" height="22"/>
        <text class="monoa" x="406" y="359" font-size="10">oracle/</text>
