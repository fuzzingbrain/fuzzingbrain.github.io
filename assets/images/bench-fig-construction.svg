        <!-- RED -->
        <rect class="bxno" x="652" y="228" width="186" height="154" rx="2"/>
        <text class="tno" x="666" y="250" font-size="12" font-weight="700">Removed before publication</text>
        <path class="hairno" d="M666 258 H824"/>

        <text class="tm" x="666" y="282" font-size="9.5">&#8211;&#8194;the reference proof-of-concept</text>
        <text class="tm" x="666" y="304" font-size="9.5">&#8211;&#8194;the patch and the fix commit</text>
        <text class="tm" x="666" y="326" font-size="9.5">&#8211;&#8194;the git history</text>
        <text class="tm" x="666" y="348" font-size="9.5">&#8211;&#8194;the upstream repo and commit pins</text>
