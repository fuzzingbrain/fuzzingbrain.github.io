                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#46535F"/>
          </marker>
          <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#6F7D8A"/>
          </marker>
        </defs>

        <path class="band" d="M152 18 V406 M372 18 V406"/>

        <text class="cap" x="6"   y="30">1 &#8212; defect sources</text>
        <text class="cap" x="176" y="30">2 &#8212; selection and challenge build</text>
        <text class="cap" x="392" y="30">3 &#8212; verify and remove answer</text>

        <!-- ============ column 1 : rows 1-3 ============ -->
        <rect class="bxt" x="6" y="60"  width="124" height="64" rx="2"/>
        <text class="t"  x="68" y="88"  font-size="12"   text-anchor="middle">OSS-Fuzz</text>
        <text class="tm" x="68" y="104" font-size="10.5" text-anchor="middle">bug tracker</text>

        <rect class="bxt" x="6" y="144" width="124" height="64" rx="2"/>
        <g class="logo" transform="translate(39,161) scale(0.5833)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></g>
        <text class="t"  x="78" y="172" font-size="12"   text-anchor="middle">GitHub</text>
        <text class="tm" x="68" y="188" font-size="10.5" text-anchor="middle">issue &#183; PR &#183; advisory</text>

        <rect class="bxt" x="6" y="228" width="124" height="64" rx="2"/>
        <text class="t"  x="68" y="252" font-size="12"   text-anchor="middle">Other work</text>
        <text class="tm" x="68" y="266" font-size="10"   text-anchor="middle">FuzzingBrain V2</text>
        <text class="tm" x="68" y="278" font-size="10"   text-anchor="middle">QuartetFuzz</text>

        <path class="arr" d="M130 92 H144 M130 176 H144 M130 260 H144 M144 92 V260"/>
        <path class="arr" d="M144 176 H160 M160 176 V92 M160 92 H172" marker-end="url(#ah)"/>

        <!-- ============ column 2 : rows 1-3 ============ -->
        <rect class="bx" x="176" y="60" width="176" height="64" rx="2"/>
        <text class="t"  x="264" y="84"  font-size="12"   text-anchor="middle" font-weight="700">Select fuzzing finding</text>
        <text class="tm" x="264" y="100" font-size="10.5" text-anchor="middle">public reports of bugs reached</text>
        <text class="tm" x="264" y="113" font-size="10.5" text-anchor="middle">through a fuzzing harness</text>
        <path class="arr" d="M264 124 V142" marker-end="url(#ah)"/>

        <rect class="bx" x="176" y="144" width="176" height="64" rx="2"/>
        <text class="t"  x="264" y="168" font-size="12"   text-anchor="middle" font-weight="700">Extract defect info</text>
        <text class="tm" x="264" y="184" font-size="10.5" text-anchor="middle">source at the vulnerable commit,</text>
        <text class="tm" x="264" y="197" font-size="10.5" text-anchor="middle">harness, sanitizer config, PoC</text>
        <path class="arr" d="M264 208 V226" marker-end="url(#ah)"/>

        <rect class="bx" x="176" y="228" width="176" height="64" rx="2"/>
